<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" th:href="@{/css/navbar.css}" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }

    .page-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .error-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.09);
      padding: 48px 56px;
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    .error-icon {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 20px;
    }

    .error-code {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e293b;
      margin: 0 0 12px;
      line-height: 1.2;
    }

    .error-divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, #6a73b2, #a5b4fc);
      border-radius: 2px;
      margin: 0 auto 18px;
    }

    .error-message {
      font-size: 0.92rem;
      color: #64748b;
      line-height: 1.7;
      margin: 0 0 32px;
    }

    .btn-home {
      display: inline-block;
      background-color: #4CAF50;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 11px 28px;
      text-decoration: none;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
      margin-right: 8px;
    }
    .btn-home:hover { background-color: #3d9140; transform: translateY(-1px); }

    .btn-back {
      display: inline-block;
      background-color: #f1f5f9;
      color: #374151;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 11px 28px;
      text-decoration: none;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
    }
    .btn-back:hover { background-color: #e2e8f0; transform: translateY(-1px); }

    .error-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      font-size: 0.78rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="page-content">
    <div class="error-card">

      <div class="error-icon">🚧</div>
      <div class="error-code">Error — Something went wrong</div>
      <h1 class="error-title">Page Not Found</h1>
      <div class="error-divider"></div>
      <p class="error-message">
        The page you are looking for does not exist, or an unexpected error occurred.<br/>
        Please check the URL or navigate back to a known page.
      </p>

      <div>
        <a href="/" class="btn-home">🏠 Go to Home</a>
        <a href="javascript:history.back()" class="btn-back">← Go Back</a>
      </div>

      <div class="error-footer">
        If this keeps happening, please contact your system administrator.
      </div>

    </div>
  </div>

</body>
</html>
