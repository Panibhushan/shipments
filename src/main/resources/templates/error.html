<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
 
  <link rel="stylesheet" th:href="@{/css/navbar.css}" />

 

<style>
	.href-styling {
		display: inline-block;
		font-weight: bold;
		padding: 10px 20px;
		text-decoration: none;
		border-radius: 6px;
	}

	.active-a-tag {
		background-color: #4CAF50;
		color: white;
		pointer-events: none;
		border: 2px solid green;
	}
 
</style>


</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>


	<h1>⚠ Something went wrong</h1>
	<p>The page you are looking for does not exist or an error
		occurred.</p>

	<a href="/">
		<button
			style="display: inline-block; background-color: #4CAF50; color: #fcfaf5; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px; border-color: white; cursor: pointer;">Go
			to Home</button>
	</a>

</body>

</html>
