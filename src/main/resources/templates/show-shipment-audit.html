<!DOCTYPE html>
<html>

<style>
#shipmentDetailsTable {
	width: 80%;
	border-collapse: separate;
	border-spacing: 0 6px;
	font-family: Arial, sans-serif;
	border: none;
	box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
}

thead th {
	text-align: center;
	padding: 6px;
	color: #374151;
	background: #ededb9;
	border: 1px #e6e65c;
}

tbody tr {
	box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
	margin: auto auto;
}

td {
	padding: 8px;
	margin: auto auto;
}

button {
	margin: 3px 3px;
	padding: 10px 10px;
	cursor: pointer;
}

button:hover {
	transform: scale(1.01);
	transition: 0.2s;
}

#viewShipmentAuditDetailsButton {
	cursor: pointer;
	text-align: center;
	font-family: Arial, sans-serif;
	padding: 6px;
	color: #374151;
	background: #ededb9;
	border: 1px #e6e65c;
}

#viewShipmentAuditDetailsButton:hover {
	transform: scale(1.01);
	transition: 0.2s;
}

.href-styling {
	display: inline-block;
	font-weight: bold;
	padding: 10px 20px;
	text-decoration: none;
	border-radius: 6px;
}

.active-a-tag {
	background-color: #4CAF50;
	color: white;
	pointer-events: none;
	border: 2px solid green;
}

ul {
	list-style-type: none;
	margin: 0;
	padding: 0;
	overflow: hidden;
	background-color: #006f5b;
}

ul li {
	float: left;
}

ul li a {
	display: block;
	color: white;
	text-align: center;
	padding: 14px 16px;
	text-decoration: none;
}

ul li a:hover {
	background-color: #111111;
}

#shipmentAuditTable table {
	font-family: Arial, sans-serif;
	border-collapse: collapse;
	width: 100%;
}

#shipmentAuditTable td, th {
	border: 1px solid #ddd;
	padding: 8px;
}

#shipmentAuditTable th {
	padding-top: 12px;
	padding-bottom: 12px;
	text-align: center;
	font-family: Arial, sans-serif;
	background-color: #ededb9;
	color:  #374151;
}
</style>

<body>
	<ul>
		<li><a href="/"> Home </a>
		<li><a href="/shipments/goToCreateShipmentPage">Create New
				Shipment</a></li>
		<li><a href="/shipments/">Show ALL Shipments</a></li>
		<li><a href="/customers/goToCreateCustomerPage">Create New
				Customer</a></li>
		<li><a href="/customers/">Show ALL Customers</a></li>
	</ul>

	<h2>Shipment Details</h2>

	<table border="1" id="shipmentDetailsTable">

		<thead>
			<tr>
				<th>Shipment ID</th>
				<th>Customer</th>
				<th>Shipment Status</th>
			</tr>
		</thead>
		<!-- 	<td th:text="${shipment}"> </td> -->

		<tr>
			<td th:text="${shipment.shipmentId}"></td>

			<td th:text="${shipment.customerName}"></td>
			<!-- 			<td th:text="${shipment.shipStatus}"></td>
 -->
			<td th:switch="${shipment.shipStatus}"><span th:case="1100">1100
					- Created</span> <span th:case="1200">1200 - Picked</span> <span
				th:case="1300">1300 - Packed</span> <span th:case="1400">1400
					- Shipped</span> <span th:case="9000">9000 - Cancelled</span> <span
				th:case="*"> <span
					th:text="|${shipment.shipStatus} - Unknown Status|"></span></span></td>


			<td th:if="${!(shipment.shipStatus == 1400 || shipment.shipStatus == 9000)}">
				<form
					th:action="@{/shipments/updateShipmentStatusFromInsideShipmentAuditDetailsPage}"
					method="post">

					<input type="hidden" name="shipmentId"
						th:value="${shipment.shipmentId}" /> <input type="hidden"
						name="shipStatus" th:value="${shipment.shipStatus}" />

					<button type="submit" name="action" value="PICK"
						th:if="${shipment.shipStatus == 1100}"
						style="background-color: #b4dcef; color: #5015b9; border: none; font-weight: bold;">Start
						Picking</button>
					<button type="submit" name="action" value="PACK"
						th:if="${shipment.shipStatus == 1200}"
						style="background-color: #ebe2a2; color: #422006; border: none; font-weight: bold;">Pack
						the Shipment</button>
					<button type="submit" name="action" value="SHIP"
						th:if="${shipment.shipStatus == 1300}"
						style="background-color: #a5e38f; color: #14532d; border: none; font-weight: bold;"
						onclick="return confirmSubmit(event, 'SHIP')">Ship the
						Shipment</button>
					<button
						th:if="${!(shipment.shipStatus == 1400 || shipment.shipStatus == 9000)}"
						type="submit" name="action" value="CANCEL"
						style="background-color: #ed4758; color: #ffffff; border: none; font-weight: bold;"
						onclick="return confirmSubmit(event, 'CANCEL')">CANCEL
						the Shipment</button>
				</form>
			</td>
		</tr>
		<tr style="display: hidden"></tr>
		<tr style="display: hidden"></tr>
		<!-- <tr>
			<td><a id="viewShipmentAuditDetailsButton"
				onclick="loadShipmentAuditDetailsContent()"> <span
					id="viewOrHideTextInSpanTag">Hide</span> Shipment Audit
			</a></td>
		</tr>
				<tr>
			<td th:text="${shipmentAudit}"></td>
		</tr> -->

	</table>

	<br />

	<a id="viewShipmentAuditDetailsButton"
		onclick="loadShipmentAuditDetailsContent()"> <span
		id="viewOrHideTextInSpanTag">Hide</span> Shipment Audit
	</a>

	<br />
	<br />

	<table id="shipmentAuditTable" border="1">
		<tr>
			<th>Shipment Status</th>
			<th>Event DateTime</th>
		</tr>
		<tr th:each="s : ${shipmentAudit}">
			<td th:text="${s.shipmentStatus}"></td>
			<td th:text="${s.eventDate}"></td>
		</tr>
	</table>

	<br />
	<br />


	<script>
		function confirmSubmit(event, eventType) {
			const confirmed = confirm("Are you sure you want to " + eventType
					+ " this shipment ?");

			if (!confirmed) {
				event.preventDefault(); // stop form submission
				return false;
			}

			return true;
		}

		function loadShipmentAuditDetailsContent() {
			let table = document.getElementById("shipmentAuditTable");

			if (table.style.display === "none") {
				table.style.display = "table";
				document.getElementById('viewOrHideTextInSpanTag').innerHTML = 'Hide';
			} else {
				document.getElementById('viewOrHideTextInSpanTag').innerHTML = 'View';
				table.style.display = "none";
			}
		}
	</script>


</body>
</html>
