<!DOCTYPE html>
<html>

<head>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      text-align:center;
    }

*, *::before, *::after {
    box-sizing: border-box;
}

.grid-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    height: 100vh;
    width: 100vw;
}

    .grid-item {
      border: 2px solid black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-family: sans-serif;
    }

    .item1 { background: #d8f0b9; }
    .item2 { background: #43dbcd; }
    .item3 { background: #cb95aa; }
    .item4 { background: #d7ccaa; }
    .item5 { background: #cfffb6; }
    .item6 { background: #b6c2ff; }
    .item7 { background: #edb3e7; }
    .item8 { background: #a3ad64; }
  </style>
</head>

<body>
  <div class="grid-container">
    <div class="grid-item item1">
      <a href="/shipments/goToCreateShipmentPage"
        style="display: inline-block; background-color: #d5e6be; color: #24360c; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">
        Create New Shipment
      </a>
    </div>
    <div class="grid-item item3">
      <a href="/customers/goToCreateCustomerPage"
        style="display: inline-block; background-color: #e090b0; color: #4a2e39; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">
        Create New Customer
      </a>
    </div>
   
    <div class="grid-item item5">
      <a href="/warehouses/goToCreateWarehousePage"
        style="display: inline-block; background-color: #bdf3ba; color: #4a2e39; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">
        Create New Warehouse
      </a>
    </div>
    <div class="grid-item item7">
      <a href="/items/goToCreateItemPage"
        style="display: inline-block; background-color: #de9dc9; color: #66635b; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">
        Create Item
      </a>
    </div>       
    <div class="grid-item item2">
      <a href="/shipments/"
        style="display: inline-block; background-color: #47eddf; color: #592a51; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">
        Show ALL Shipments
      </a>
    </div>
     <div class="grid-item item4">
      <a href="/customers/"
        style="display: inline-block; background-color: #e8dec3; color: #66635b; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">
        Show ALL Customers
      </a>
    </div>
    <div class="grid-item item6">
      <a href="/warehouses/"
        style="display: inline-block; background-color: #9da7de; color: #66635b; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">
        Show ALL Warehouses
      </a>
    </div>
    <div class="grid-item item8">
      <a href="/items/"
        style="display: inline-block; background-color: #bab57d; color: #66635b; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">
        Show ALL Items
      </a>
    </div>    
  </div>
</body>

</html>
