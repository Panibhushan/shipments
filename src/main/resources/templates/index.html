<!DOCTYPE html>
<html>

<body>



  <head>
    <style>
      /* Reset default margins so the grid touches the screen edges */
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      .grid-container {
        display: grid;
        /* Create 2 columns of equal size (1 fraction each) */
        grid-template-columns: 1fr 1fr;
        /* Create 2 rows of equal size (1 fraction each) */
        grid-template-rows: 1fr 1fr;
        /* Fill the full height of the viewport */
        height: 100vh;
        width: 100vw;
      }

      /* Just for styling visibility */
      .grid-item {
        border: 2px solid black;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-family: sans-serif;
      }

      /* Optional: Colors for distinction */
      .item1 {
        background: #d8f0b9;
      }

      .item2 {
        background: #43dbcd;
      }

      .item3 {
        background: #cb95aa;
      }

      .item4 {
        background: #d7ccaa;
      }
    </style>
  </head>

  <body>
    <div class="grid-container">
      <div class="grid-item item1"> <a href="/shipments/goToCreateShipmentPage"
          style="display: inline-block; background-color: #d5e6be; color: #24360c; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">Create
          New Shipment</a>
      </div>
      <div class="grid-item item2"><a href="/shipments/"
          style="display: inline-block; background-color: #47eddf; color: #592a51; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">Show
          ALL Shipments</a>
      </div>
      <div class="grid-item item3"><a href="/customers/goToCreateCustomerPage"
          style="display: inline-block; background-color: #e090b0; color: #4a2e39; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">Create
          New Customer</a>
      </div>
      <div class="grid-item item4"><a href="/customers/"
          style="display: inline-block; background-color: #e8dec3; color: #66635b; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">Show
          ALL Customers</a>
      </div>
    </div>

  </body>

</html>
