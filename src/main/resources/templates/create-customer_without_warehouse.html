<!DOCTYPE html>
<html>
<style>
	select {
		width: 50%;
		padding: 12px;
		margin: 8px 0;
		display: inline-block;
		border: 1px solid #ccc;
		border-radius: 4px;
		box-sizing: border-box;
	}

	.href-styling {
		display: inline-block;
		font-weight: bold;
		padding: 10px 20px;
		text-decoration: none;
		border-radius: 6px;
	}

	.active-a-tag {
		background-color: #4CAF50;
		color: white;
		pointer-events: none;
		border: 2px solid green;
	}

	ul {
		list-style-type: none;
		margin: 0;
		padding: 0;
		overflow: hidden;
		background-color: #006f5b;
	}

	ul li {
		float: left;
	}

	ul li a {
		display: block;
		color: white;
		text-align: center;
		padding: 14px 16px;
		text-decoration: none;
	}

	ul li a:hover {
		background-color: #111111;
	}
</style>

<body>
	<ul>
		<li><a href="/"> Home </a>
		<li><a href="/shipments/goToCreateShipmentPage" class="active-a-tag">Create New Shipment</a></li>
		<li><a href="/shipments/">Show ALL Shipments</a></li>
		<li><a href="/customers/goToCreateCustomerPage">Create New Customer</a></li>
		<li><a href="/customers/">Show ALL Customers</a></li>
		<li><a href="/warehouses/goToCreateWarehousePage">Create New
				Warehouse</a></li>
		<li><a href="/warehouses/">Show ALL Warehouses</a></li>
	</ul>
	<!-- 
	<div>
		<a href="/"
			style="background-color: #c98b1c; color: #f5f0e9; margin-right: 3px"
			class="href-styling"> Home </a><a
			href="/shipments/goToCreateShipmentPage"
			class="href-styling active-a-tag">Create New Shipment</a> <a
			href="/shipments/" class="href-styling"
			style="background-color: #47eddf; color: #592a51;">Show ALL
			Shipments</a> <a href="/customers/goToCreateCustomerPage"
			class="href-styling"
			style="background-color: #e090b0; color: #4a2e39;">Create New
			Customer</a> <a href="/customers/" class="href-styling"
			style="background-color: #e8d399; color: #66635b;">Show ALL
			Customers</a>
	</div>
 -->
	<p th:if="${msg}" id="msgBox"
		th:style="'background:' + ${bgColor} + '; color:' + ${textColor} + '; padding:10px; border-radius:6px; position:relative; font-weight:bold;'">
				<span th:text="${msg}" style="white-space: pre-wrap;"></span> <span></span> <span th:text="${shipmentId}"></span>

		<!-- hyperlink to shipment page -->
		&nbsp;&nbsp;<a th:href="@{'/shipments/showShipmentDetails/' + ${shipmentId}}">
			View Shipment Details</a>
		<!-- ❌ Close button -->
		<span onclick="this.parentElement.style.display='none'"
			style="position: absolute; margin: auto; right: 14px; cursor: pointer; font-weight: bold;">
			X </span>
	</p>

	<h2>Create New Shipment</h2>

	<form action="/shipments/createShipment" method="post">
		<select name="customerId" required>
			<option value="">-- Select Customer --</option>
			<option th:each="c : ${customers}" th:value="${c.customerId}"
				th:text="|${c.customerId} = ${c.customerName}|"></option>
		</select> <br />
		
		<select name="warehouseId" required>
			<option value="">-- Select Warehouse --</option>
			<option th:each="w : ${warehouses}" th:value="${w.warehouseId}"
				th:text="|${w.warehouseId} = ${w.warehouseName}|"></option>
		</select> <br />

		<a href="/customers/goToCreateCustomerPage">Customer Doesn't Exist ? Create a New Customer</a> <br /> <br />

		<button type="submit"
			style="display: inline-block; background-color: #4CAF50; color: #fcfaf5; font-weight: bold; padding: 10px 20px; border: none; cursor:pointer;">
			Create Shipment</button>
	</form>

	<br />
	<br />

	<!-- <a href="/customers/goToCreateCustomerPage"
		style="display: inline-block; background-color: #47eddf; color: #592a51; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">Create
		New Customer</a> -->

	<script>
		window.addEventListener("load", function () {
			var msg = document.getElementById("msgBox");
			if (msg) {
				setTimeout(function () {
					msg.style.display = "none";
				}, 10000);
			}
		});
	</script>

</body>

</html>
