<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<link rel="stylesheet" th:href="@{/css/navbar.css}" />

<style>
table {
	width: 90%;
	border-collapse: separate;
	border-spacing: 0 6px;
	font-family: Arial, sans-serif;
	border: none;
	box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
}

thead th {
	text-align: center;
	padding: 6px;
	color: #374151;
	background: #ededb9;
	border: 1px #e6e65c;
}

tbody tr {
	box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
	margin: auto auto;
}

td {
	padding: 8px;
	margin: auto auto;
	text-align: center;
}

/* tbody tr td:first-child {
	border-top-left-radius: 8px;
	border-bottom-left-radius: 8px;
}

tbody tr td:last-child {
	border-top-right-radius: 8px;
	border-bottom-right-radius: 8px;
} */
tbody tr:hover {
	transform: scale(1.01);
	transition: 0.2s;
	/* background: #f4f4d9;   */
	background: #efefef;
}

button {
	margin: 3px 3px;
	padding: 10px 10px;
	cursor: pointer;
}

button:hover {
	transform: scale(1.01);
	transition: 0.2s;
}

/* 	#viewShipmentDetails {
		background-color: #b4dcef;
		color: #5015b9;
		font-weight: bold;
		text-decoration: none;
		margin: 3px 3px;
		padding: 10px 10px;
		cursor: pointer;
	} */
#viewShipmentDetails {
	display: inline-block;
	min-width: 140px;
	text-align: center;
	background-color: #b4dcef;
	color: #5015b9;
	font-weight: bold;
	text-decoration: none;
	padding: 10px 16px;
	margin: 3px;
}

.href-styling {
	display: inline-block;
	font-weight: bold;
	padding: 10px 20px;
	text-decoration: none;
	border-radius: 6px;
}

/* ── Filter Bar ── */
.filter-bar {
	display: flex;
	align-items: center;
	margin: 16px 0 10px 0;
}

.filter-bar form {
	display: flex;
	align-items: center;
	gap: 10px;
	background: #f0f4ff;
	border: 1px solid #c5cff5;
	border-radius: 10px;
	padding: 10px 18px;
}

.filter-bar label {
	font-family: Arial, sans-serif;
	font-size: 0.82rem;
	font-weight: 700;
	color: #4a4e8a;
	text-transform: uppercase;
	letter-spacing: 0.06em;
	white-space: nowrap;
}

.filter-bar select {
	padding: 8px 14px;
	border: 1.5px solid #b0baf5;
	border-radius: 7px;
	font-size: 0.92rem;
	font-family: Arial, sans-serif;
	color: #2c2f6b;
	background: #ffffff;
	cursor: pointer;
	min-width: 220px;
	outline: none;
	transition: border-color 0.2s;
}

.filter-bar select:focus {
	border-color: #6a73b2;
}

.filter-bar button {
	padding: 8px 22px;
	background-color: #6a73b2;
	color: #ffffff;
	font-weight: 700;
	font-size: 0.88rem;
	font-family: Arial, sans-serif;
	border: none;
	border-radius: 7px;
	cursor: pointer;
	letter-spacing: 0.04em;
	transition: background-color 0.2s, transform 0.15s;
	margin: 0;
}

.filter-bar button:hover {
	background-color: #555fa0;
	transform: translateY(-1px);
}

.filter-bar button:disabled {
	background-color: #b0b5d8;
	cursor: not-allowed;
	transform: none;
}

.submit-btn-wrapper {
	position: relative;
	display: inline-block;
}

.submit-btn-wrapper .tooltip-text {
	visibility: hidden;
	opacity: 0;
	width: 220px;
	background-color: #4a4e8a;
	color: #fff;
	text-align: center;
	border-radius: 6px;
	padding: 7px 10px;
	font-size: 0.78rem;
	position: absolute;
	bottom: 125%;
	left: 50%;
	transform: translateX(-50%);
	transition: opacity 0.2s;
	pointer-events: none;
	z-index: 10;
}

.submit-btn-wrapper .tooltip-text::after {
	content: '';
	position: absolute;
	top: 100%;
	left: 50%;
	transform: translateX(-50%);
	border-width: 5px;
	border-style: solid;
	border-color: #4a4e8a transparent transparent transparent;
}

/* show tooltip only when button is disabled */
.submit-btn-wrapper:hover .tooltip-text.show-tooltip {
	visibility: visible;
	opacity: 1;
}
</style>

</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<br />
	<p th:if="${msg}" id="msgBox"
		th:style="'background:' + ${bgColor} + '; color:' + ${textColor} + '; padding:10px; border-radius:6px; position:relative; font-weight:bold;'">
		<span th:utext="${msg}" style="white-space: pre-wrap;"></span><span
			onclick="this.parentElement.style.display='none'"
			style="position: absolute; margin: auto; right: 14px; top: 40%; cursor: pointer; font-weight: bold;">X</span>
	</p>
	<a href="/shipments/goToCreateShipmentPage"
		style="display: inline-block; background-color: #4CAF50; color: #fcfaf5; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">Create
		New Shipment</a>

	<br />
	<div class="filter-bar">
		<!--  customer-id in form action will be dynamically updated in script -->
		<form id="customerAndWarehouseForm"
			th:action="@{/shipments/showShipmentsByCustomerAndWarehouse/ALL/ALL}"
			method="post">

			<label for="customerId">Customer</label> <select name="customerId"
				id="customerId" onchange="loadWarehouses(this.value)" required>
				<option value="ALL">-- ALL --</option>
				<option th:each="c : ${customers}" th:value="${c.customerId}"
					th:selected="${c.customerId == selectedCustomer}"
					th:text="|${c.customerId} = ${c.customerName}|"></option>
			</select> <label for="warehouseId">Warehouse</label> <select
				name="warehouseSelect" id="warehouseSelect" required>
				<option value="ALL">-- ALL --</option>
				<option th:each="w : ${warehouses}" th:value="${w.warehouseId}"
					th:selected="${w.warehouseId == selectedWarehouse}"
					th:text="|${w.warehouseId} = ${w.warehouseName}|"></option>
			</select>

			<div class="submit-btn-wrapper" id="submitBtnWrapper">
				<button type="submit" id="applyFiltersBtn">Apply Filters</button>
			</div>
		</form>

	</div>

	<table border="1">

		<thead>
			<tr>
				<th>Shipment ID</th>
				<th>Customer</th>
				<th>Warehouse</th>
				<th>Status</th>
				<th colspan="2">Actions</th>
			</tr>
		</thead>
		<tr th:each="s : ${shipments}">
			<td><a
				th:href="@{'/shipments/showShipmentDetails/' + ${s.shipmentId}}"
				style="color: blue; font-weight: bold;"> <span
					th:text="${s.shipmentId}"></span>
			</a></td>

			<!-- 	<td th:text="${s.customerId}"></td>
			<td th:text="${s.warehouseId}"></td> -->

			<td><a target="_blank" style="color: blue; font-weight: bold;"
				th:href="@{'/customers/showCustomerDetails/' + ${s.customerId}}"
				th:text="${s.customerId}"> </a></td>
			<td><a target="_blank" style="color: blue; font-weight: bold;"
				th:href="@{'/warehouses/showWarehouseDetails/' + ${s.warehouseId}}"
				th:text="${s.warehouseId}"> </a></td>

			<!-- 	<td th:text="${s.shipStatus}"></td> -->

			<td th:switch="${s.shipStatus}"><span th:case="1100"
				style="background-color: #ddd8d8; color: #212021; border: none; font-weight: bold; padding: 6px 10px;">1100
					- Created</span> <span th:case="1200"
				style="background-color: #b4dcef; color: #5015b9; border: none; font-weight: bold; padding: 6px 10px;">1200
					- Picked</span> <span th:case="1300"
				style="background-color: #ebe2a2; color: #422006; border: none; font-weight: bold; padding: 6px 10px;">1300
					- Packed</span> <span th:case="1400"
				style="background-color: #a5e38f; color: #14532d; border: none; font-weight: bold; padding: 6px 10px;">1400
					- Shipped</span> <span th:case="9000"
				style="background-color: #ed4758; color: #ffffff; border: none; font-weight: bold; padding: 6px 10px;">9000
					- Cancelled</span> <span th:case="*"> <span
					th:text="|${s.shipStatus} - Unknown Status|"></span></span></td>

			<td style="text-align: center; vertical-align: middle;"><a
				th:href="@{'/shipments/showShipmentDetails/' + ${s.shipmentId}}"
				id="viewShipmentDetails"> View Details </a></td>

			<!-- show Cancel button only if the shipment status is below 1400, i.e., not shipped / cancelled -->
			<td th:if="${(s.shipStatus < 1400)}"
				style="text-align: center; vertical-align: middle;">
				<form th:action="@{/shipments/cancelShipmentFromAllShipmentsPage}"
					method="post">

					<input type="hidden" name="shipmentId" th:value="${s.shipmentId}" />
					<input type="hidden" name="shipStatus" th:value="${s.shipStatus}" />
					<input type="hidden" name="customerId" th:value="${s.customerId}" />
					<input type="hidden" name="warehouseId" th:value="${s.warehouseId}" />

					<!-- show Cancel button only if the shipment status is below 1400, i.e., not shipped / cancelled -->
					<button th:if="${(s.shipStatus < 1400)}" type="submit"
						name="action" value="CANCEL"
						style="background-color: #ed4758; color: #ffffff; border: none; font-weight: bold;"
						onclick="return confirmSubmit(event, 'CANCEL')"
						th:id="|button${s.shipmentId}|">CANCEL the Shipment</button>


				</form>
			</td>
		</tr>
	</table>

	<!-- Show this if shipments list is EMPTY -->
	<div th:if="${#lists.isEmpty(shipments)}"
		style="text-align: center; color: #888;">
		<p style="font-size: 1.1rem; margin-bottom: 10px;">No shipment
			records to display.</p>
		<br /> <a href="/shipments/goToCreateShipmentPage"
			style="background: #4CAF50; color: white; padding: 8px 18px; border-radius: 6px; text-decoration: none; font-weight: bold;">
			Create New Shipment </a>
	</div>

	<script>
    // ── track whether either dropdown has changed ──
    let filtersChanged = false; 
    
    window.addEventListener("load", function () {

        // disable submit on page load
        const btn = document.getElementById('applyFiltersBtn');
        btn.disabled = true;

        // inject tooltip span
        const wrapper = document.getElementById('submitBtnWrapper');
        const tooltip = document.createElement('span');
        tooltip.className = 'tooltip-text show-tooltip';
        tooltip.textContent = 'Make some changes to Customer or Warehouse to enable the button';
        wrapper.appendChild(tooltip);

        // msg box auto-hide
        var msg = document.getElementById("msgBox");
        if (msg) {
            setTimeout(function () { msg.style.display = "none"; }, 10000);
        }
    });

    // enable button when customer dropdown changes
    document.getElementById('customerId').addEventListener('change', function () {
        filtersChanged = true;
        document.getElementById('applyFiltersBtn').disabled = false;
    });

    // enable button when warehouse dropdown changes
    document.getElementById('warehouseSelect').addEventListener('change', function () {
        filtersChanged = true;
        document.getElementById('applyFiltersBtn').disabled = false;
    });

    // confirmation before cancelling a shipment
    function confirmSubmit(event, eventType) {
        const confirmed = confirm("Are you sure you want to " + eventType + " this shipment?");
        if (!confirmed) {
            event.preventDefault();
            return false;
        }
        return true;
    }

    // dynamically load warehouses based on selected customer
    function loadWarehouses(customerId) {
        const warehouseSelect = document.getElementById('warehouseSelect');
        warehouseSelect.innerHTML = '<option value="ALL">-- ALL --</option>';

        if (!customerId || customerId === 'ALL') return;

        fetch(`/shipments/getWarehousesByCustomer?customerId=${customerId}`, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
        })
        .then(response => {
            if (!response.ok) throw new Error('Failed to fetch warehouses');
            return response.json();
        })
        .then(data => {
            if (data && data.length > 0) {
                data.forEach(w => {
                    const option = document.createElement('option');
                    option.value = w.warehouseId;
                    option.textContent = `${w.warehouseId} = ${w.warehouseName}`;
                    warehouseSelect.appendChild(option);
                });
            }
        })
        .catch(err => {
            console.error('Error:', err);
            warehouseSelect.innerHTML = '<option value="ALL">-- Error Loading Warehouses --</option>';
        });
    }

    // dynamically update form action on submit
    document.getElementById('customerAndWarehouseForm').addEventListener('submit', function (e) {
        e.preventDefault();

        if (!filtersChanged) {
            alert('No changes were made — filters not applied.');
            return;
        }

        const customerId  = document.getElementById('customerId').value;
        const warehouseId = document.getElementById('warehouseSelect').value;
        this.action = '/shipments/showShipmentsByCustomerAndWarehouse/' + customerId + '/' + warehouseId;
        this.submit();
    });
    
    
    document.getElementById('customerId').addEventListener('change', function () {
        filtersChanged = true;
        document.getElementById('applyFiltersBtn').disabled = false;
        document.querySelector('.tooltip-text').classList.remove('show-tooltip'); // hide tooltip
    });

    document.getElementById('warehouseSelect').addEventListener('change', function () {
        filtersChanged = true;
        document.getElementById('applyFiltersBtn').disabled = false;
        document.querySelector('.tooltip-text').classList.remove('show-tooltip'); // hide tooltip
    });
    
    
</script>

</body>

</html>
