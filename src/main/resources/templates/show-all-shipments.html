<!DOCTYPE html>
<html>

<style>
	table {
		width: 80%;
		border-collapse: separate;
		border-spacing: 0 6px;
		font-family: Arial, sans-serif;
		border: none;
		box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
	}

	thead th {
		text-align: center;
		padding: 6px;
		color: #374151;
		background: #ededb9;
		border: 1px #e6e65c;
	}

	tbody tr {
		box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
		margin: auto auto;
	}

	td {
		padding: 8px;
		margin: auto auto;
		text-align: center;
	}

	/* tbody tr td:first-child {
	border-top-left-radius: 8px;
	border-bottom-left-radius: 8px;
}

tbody tr td:last-child {
	border-top-right-radius: 8px;
	border-bottom-right-radius: 8px;
} */
	tbody tr:hover {
		transform: scale(1.01);
		transition: 0.2s;
		/* background: #f4f4d9;   */
		background: #efefef;
	}

	button {
		margin: 3px 3px;
		padding: 10px 10px;
		cursor: pointer;
	}

	button:hover {
		transform: scale(1.01);
		transition: 0.2s;
	}

	/* 	#viewShipmentDetails {
		background-color: #b4dcef;
		color: #5015b9;
		font-weight: bold;
		text-decoration: none;
		margin: 3px 3px;
		padding: 10px 10px;
		cursor: pointer;
	} */
	#viewShipmentDetails {
		display: inline-block;
		min-width: 140px;
		text-align: center;
		background-color: #b4dcef;
		color: #5015b9;
		font-weight: bold;
		text-decoration: none;
		padding: 10px 16px;
		margin: 3px;
	}

	.href-styling {
		display: inline-block;
		font-weight: bold;
		padding: 10px 20px;
		text-decoration: none;
		border-radius: 6px;
	}

	.active-a-tag {
		background-color: #4CAF50;
		color: white;
		pointer-events: none;
		border: 2px solid green;
	}

	ul {
		list-style-type: none;
		margin: 0;
		padding: 0;
		overflow: hidden;
		background-color: #006f5b;
	}

	ul li {
		float: left;
	}

	ul li a {
		display: block;
		color: white;
		text-align: center;
		padding: 14px 16px;
		text-decoration: none;
	}

	ul li a:hover {
		background-color: #111111;
	}
</style>

<body>

	<ul>
		<li><a href="/"> Home </a>
		<li><a href="/shipments/goToCreateShipmentPage">Create New
				Shipment</a></li>
		<li><a href="/shipments/" class="active-a-tag">Show ALL
				Shipments</a></li>
		<li><a href="/customers/goToCreateCustomerPage">Create New
				Customer</a></li>
		<li><a href="/customers/">Show ALL Customers</a></li>
	</ul>


	<p th:if="${msg}" id="msgBox"
		th:style="'background:' + ${bgColor} + '; color:' + ${textColor} + '; padding:10px; border-radius:6px; position:relative; font-weight:bold;'">
	<span th:text="${msg}" style="white-space: pre-wrap;"></span> <span onclick="this.parentElement.style.display='none'"
			style="position: absolute; margin: auto; right: 14px; cursor: pointer; font-weight: bold;">X</span>
	</p>

	<!-- <p th:if="${msg}" id="msgBox"
		style="background: #d95f6c; color: #ffffff; padding: 10px; border-radius: 6px; position: relative;; font-weight: bold;">

		<span th:text="${msg}"></span>

		❌ Close button
		<span onclick="this.parentElement.style.display='none'"
			style="position: absolute; margin: auto; right: 10px; cursor: pointer; font-weight: bold;">
			X </span>

	</p> -->
	<h2>Shipments List</h2>

	<a href="/shipments/goToCreateShipmentPage"
		style="display: inline-block; background-color: #4CAF50; color: #fcfaf5; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">Create
		New Shipment</a>

	<table border="1">

		<thead>
			<tr>
				<th>Shipment ID</th>
				<th>Customer</th>
				<th>Shipment Status</th>
				<th colspan="2">Actions</th>
			</tr>
		</thead>
		<tr th:each="s : ${shipments}">
			<td><a th:href="@{'/shipments/showShipmentDetails/' + ${s.shipmentId}}"
					style="color: blue; font-weight: bold; text-decoration: none;">
					<span th:text="${s.shipmentId}"></span>
				</a></td>

			<td th:text="${s.customerId}"></td>
			<!-- 	<td th:text="${s.shipStatus}"></td> -->

			<td th:switch="${s.shipStatus}"><span th:case="1100">1100
					- Created</span> <span th:case="1200">1200 - Picked</span> <span th:case="1300">1300 - Packed</span>
				<span th:case="1400">1400
					- Shipped</span> <span th:case="9000">9000 - Cancelled</span> <span th:case="*"> <span
						th:text="|${s.shipStatus} - Unknown Status|"></span></span></td>

			<td style="text-align: center; vertical-align: middle;"><a
					th:href="@{'/shipments/showShipmentDetails/' + ${s.shipmentId}}" id="viewShipmentDetails"> View
					Details </a></td>

			<!-- show Cancel button only if the shipment status is below 1400, i.e., not shipped / cancelled -->
			<td th:if="${(s.shipStatus < 1400)}" style="text-align: center; vertical-align: middle;">
				<form th:action="@{/shipments/cancelShipmentFromAllShipmentsPage}" method="post">

					<input type="hidden" name="shipmentId" th:value="${s.shipmentId}" />
					<input type="hidden" name="shipStatus" th:value="${s.shipStatus}" />
					<input type="hidden" name="customerId" th:value="${s.customerId}" />


					<!-- show Cancel button only if the shipment status is below 1400, i.e., not shipped / cancelled -->
					<button th:if="${(s.shipStatus < 1400)}" type="submit" name="action" value="CANCEL"
						style="background-color: #ed4758; color: #ffffff; border: none; font-weight: bold;"
						onclick="return confirmSubmit(event, 'CANCEL')" th:id="|button${s.shipmentId}|">CANCEL the
						Shipment</button>


				</form>

			</td>

			<!-- <td>
				<form th:action="@{/shipments/updateShipmentStatus}" method="post">

					<input type="hidden" name="shipmentId" th:value="${s.shipmentId}" />
					<input type="hidden" name="shipStatus" th:value="${s.shipStatus}" />

					<button type="submit" name="action" value="PICK"
						th:if="${s.shipStatus == 1100}"
						style="background-color: #b4dcef; color: #5015b9; border: none; font-weight: bold;">Start
						Picking</button>
					<button type="submit" name="action" value="PACK"
						th:if="${s.shipStatus == 1200}"
						style="background-color: #ebe2a2; color: #422006; border: none; font-weight: bold;">Pack
						the Shipment</button>
					<button type="submit" name="action" value="SHIP"
						th:if="${s.shipStatus == 1300}"
						style="background-color: #a5e38f; color: #14532d; border: none; font-weight: bold;"
						onclick="return confirmSubmit(event, 'SHIP')">Ship the
						Shipment</button>
					<button th:if="${!(s.shipStatus == 1400 || s.shipStatus == 9000)}"
						type="submit" name="action" value="CANCEL"
						style="background-color: #ed4758; color: #ffffff; border: none; font-weight: bold;"
						onclick="return confirmSubmit(event, 'CANCEL')">CANCEL
						the Shipment</button>
				</form> 
			</td> -->
		</tr>
	</table>

	<!-- 	<div style="background: #d7d7bd; width:100px; height:100px;"></div>
 -->
	<script>
		window.addEventListener("load", function () {
			var msg = document.getElementById("msgBox");
			if (msg) {
				setTimeout(function () {
					msg.style.display = "none";
				}, 10000);
			}
		});

		function confirmSubmit(event, eventType) {
			const confirmed = confirm("Are you sure you want to " + eventType
				+ " this shipment ?");

			if (!confirmed) {
				event.preventDefault(); // stop form submission
				return false;
			}

			return true;
		}


	</script>

</body>

</html>
