	margin: auto auto;

	padding: 8px;
	margin: auto auto;
	text-align: center;

.href-styling {
	display: inline-block;
	font-weight: bold;
	padding: 10px 20px;
	text-decoration: none;
	border-radius: 6px;
}

	background-color: #4CAF50;
	color: white;
	pointer-events: none;
	border: 2px solid green;

	<a href="/shipments/goToCreateShipmentPage"
		style="display: inline-block; background-color: #4CAF50; color: #fcfaf5; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">Create
		New Shipment</a>

	<table border="1">

		<thead>
			<tr>
				<th>Shipment ID</th>
				<th>Customer</th>
				<th>Warehouse</th>
				<th>Status</th>
				<th colspan="2">Actions</th>
			</tr>
		</thead>
		<tr th:each="s : ${shipments}">
			<td><a
				th:href="@{'/shipments/showShipmentDetails/' + ${s.shipmentId}}"
				style="color: blue; font-weight: bold; text-decoration: none;">
					<span th:text="${s.shipmentId}"></span>
			</a></td>

			<!-- 	<td th:text="${s.customerId}"></td>
			<td th:text="${s.warehouseId}"></td> -->

			<td><a target="_blank" style="color: blue; font-weight: bold;"
				th:href="@{'/customers/showCustomerDetails/' + ${s.customerId}}"
				th:text="${s.customerId}"> </a></td>
			<td><a target="_blank" style="color: blue; font-weight: bold;"
				th:href="@{'/warehouses/showWarehouseDetails/' + ${s.warehouseId}}"
				th:text="${s.warehouseId}"> </a></td>

			<!-- 	<td th:text="${s.shipStatus}"></td> -->

			<td th:switch="${s.shipStatus}"><span th:case="1100"
				style="background-color: #ddd8d8; color: #212021; border: none; font-weight: bold; padding: 6px 10px;">1100
					- Created</span> <span th:case="1200"
				style="background-color: #b4dcef; color: #5015b9; border: none; font-weight: bold; padding: 6px 10px;">1200
					- Picked</span> <span th:case="1300"
				style="background-color: #ebe2a2; color: #422006; border: none; font-weight: bold; padding: 6px 10px;">1300
					- Packed</span> <span th:case="1400"
				style="background-color: #a5e38f; color: #14532d; border: none; font-weight: bold; padding: 6px 10px;">1400
					- Shipped</span> <span th:case="9000"
				style="background-color: #ed4758; color: #ffffff; border: none; font-weight: bold; padding: 6px 10px;">9000
					- Cancelled</span> <span th:case="*"> <span
					th:text="|${s.shipStatus} - Unknown Status|"></span></span></td>

			<td style="text-align: center; vertical-align: middle;"><a
				th:href="@{'/shipments/showShipmentDetails/' + ${s.shipmentId}}"
				id="viewShipmentDetails"> View Details </a></td>

			<!-- show Cancel button only if the shipment status is below 1400, i.e., not shipped / cancelled -->
			<td th:if="${(s.shipStatus < 1400)}"
				style="text-align: center; vertical-align: middle;">
				<form th:action="@{/shipments/cancelShipmentFromAllShipmentsPage}"
					method="post">

					<input type="hidden" name="shipmentId" th:value="${s.shipmentId}" />
					<input type="hidden" name="shipStatus" th:value="${s.shipStatus}" />
					<input type="hidden" name="customerId" th:value="${s.customerId}" />
					<input type="hidden" name="warehouseId" th:value="${s.warehouseId}" />

					<!-- show Cancel button only if the shipment status is below 1400, i.e., not shipped / cancelled -->
					<button th:if="${(s.shipStatus < 1400)}" type="submit"
						name="action" value="CANCEL"
						style="background-color: #ed4758; color: #ffffff; border: none; font-weight: bold;"
						onclick="return confirmSubmit(event, 'CANCEL')"
						th:id="|button${s.shipmentId}|">CANCEL the Shipment</button>


				</form>

			</td>

			<!-- <td>
				<form th:action="@{/shipments/updateShipmentStatus}" method="post">

					<input type="hidden" name="shipmentId" th:value="${s.shipmentId}" />
					<input type="hidden" name="shipStatus" th:value="${s.shipStatus}" />

					<button type="submit" name="action" value="PICK"
						th:if="${s.shipStatus == 1100}"

						Picking</button>
					<button type="submit" name="action" value="PACK"
						th:if="${s.shipStatus == 1200}"
						style="background-color: #ebe2a2; color: #422006; border: none; font-weight: bold;">Pack
						the Shipment</button>
					<button type="submit" name="action" value="SHIP"
						th:if="${s.shipStatus == 1300}"
						style="background-color: #a5e38f; color: #14532d; border: none; font-weight: bold;"
						onclick="return confirmSubmit(event, 'SHIP')">Ship the
						Shipment</button>
					<button th:if="${!(s.shipStatus == 1400 || s.shipStatus == 9000)}"

						onclick="return confirmSubmit(event, 'CANCEL')">CANCEL
						the Shipment</button>
				</form> 
			</td> -->
		</tr>
	</table>

	<!-- Show this if shipments list is EMPTY -->
	<div th:if="${#lists.isEmpty(shipments)}"
	     style="text-align:center;  color:#888;">
	    <p style="font-size:1.1rem; margin-bottom:10px;">No shipment records to display.</p><br />
	    <a href="/shipments/goToCreateShipmentPage"
	       style="background:#4CAF50; color:white; padding:8px 18px; border-radius:6px;
	              text-decoration:none; font-weight:bold;">
	         Create New Shipment
	    </a>
	</div>

	<script>
		window.addEventListener("load", function() {
			var msg = document.getElementById("msgBox");
			if (msg) {
				setTimeout(function() {
					msg.style.display = "none";
				}, 10000);
			}
		});

		function confirmSubmit(event, eventType) {
			const confirmed = confirm("Are you sure you want to " + eventType
					+ " this shipment ?");

			if (!confirmed) {
				event.preventDefault(); // stop form submission
				return false;
			}

			return true;
		}
	</script>
