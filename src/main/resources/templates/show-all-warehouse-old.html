<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" th:href="@{/css/navbar.css}" />
<style>
*, *::before, *::after {
	box-sizing: border-box;
}

body {
	font-family: Arial, sans-serif;
	background: #f4f6f9;
	margin: 0;
	min-height: 100vh;
}

#msgBox {
	margin: 8px 24px 0;
	padding: 8px 40px 8px 14px;
	border-radius: 8px;
	font-weight: bold;
	position: relative;
}

.page-content {
	padding: 14px 24px;
}

.top-bar {
	display: flex;
	align-items: center;
	justify-content: space-between;
	margin-bottom: 12px;
}

.top-bar h2 {
	margin: 0;
	font-size: 1rem;
	font-weight: 700;
	color: #1e293b;
}

.btn-add {
	display: inline-block;
	background-color: #4CAF50;
	color: #fff;
	font-weight: 700;
	font-size: 0.88rem;
	padding: 9px 20px;
	text-decoration: none;
	border-radius: 8px;
	transition: background-color 0.2s, transform 0.15s;
}

.btn-add:hover {
	background-color: #3d9140;
	transform: translateY(-1px);
}

.table-wrapper {
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
	overflow: hidden;
}

table {
	width: 100%;
	border-collapse: collapse;
	font-family: Arial, sans-serif;
	font-size: 0.88rem;
}

thead th {
	text-align: center;
	padding: 11px 14px;
	color: #374151;
	background: #f1f5f9;
	font-size: 0.72rem;
	font-weight: 700;
	text-transform: uppercase;
	letter-spacing: 0.07em;
	border-bottom: 2px solid #e2e8f0;
}

tbody tr {
	border-bottom: 1px solid #f1f5f9;
	cursor: pointer;
	transition: background 0.15s, transform 0.15s;
}

tbody tr:last-child {
	border-bottom: none;
}

tbody tr:hover {
	background: #eef2ff;
	transform: scale(1.005);
}

td {
	padding: 10px 14px;
	text-align: center;
	color: #374151;
}

.cell-link {
	position: relative;
	display: inline-block;
}

.cell-link a {
	color: #4a6fa5;
	font-weight: 700;
	text-decoration: none;
	border-bottom: 1px dashed #4a6fa5;
}

.cell-link a:hover {
	color: #2c4a7c;
}

.cell-link .cell-tip {
	visibility: hidden;
	opacity: 0;
	background: #1e293b;
	color: #fff;
	font-size: 0.72rem;
	padding: 5px 10px;
	border-radius: 5px;
	white-space: nowrap;
	position: absolute;
	bottom: 130%;
	left: 50%;
	transform: translateX(-50%);
	transition: opacity 0.18s;
	pointer-events: none;
	z-index: 10;
}

.cell-link .cell-tip::after {
	content: '';
	position: absolute;
	top: 100%;
	left: 50%;
	transform: translateX(-50%);
	border-width: 4px;
	border-style: solid;
	border-color: #1e293b transparent transparent transparent;
}

.cell-link:hover .cell-tip {
	visibility: visible;
	opacity: 1;
}

.btn-view {
	display: inline-block;
	background-color: #6a73b2;
	color: #fff;
	font-weight: 700;
	font-size: 0.78rem;
	padding: 7px 14px;
	text-decoration: none;
	border-radius: 6px;
	white-space: nowrap;
	transition: background-color 0.2s;
	position: relative;
}

.btn-view:hover {
	background-color: #555fa0;
}

.btn-view .cell-tip {
	visibility: hidden;
	opacity: 0;
	background: #1e293b;
	color: #fff;
	font-size: 0.72rem;
	padding: 5px 10px;
	border-radius: 5px;
	white-space: nowrap;
	position: absolute;
	bottom: 130%;
	left: 50%;
	transform: translateX(-50%);
	transition: opacity 0.18s;
	pointer-events: none;
	z-index: 10;
}

.btn-view .cell-tip::after {
	content: '';
	position: absolute;
	top: 100%;
	left: 50%;
	transform: translateX(-50%);
	border-width: 4px;
	border-style: solid;
	border-color: #1e293b transparent transparent transparent;
}

.btn-view:hover .cell-tip {
	visibility: visible;
	opacity: 1;
}

.btn-delete {
	background-color: #ed4758;
	color: #fff;
	font-weight: 700;
	font-size: 0.78rem;
	padding: 7px 14px;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	transition: background-color 0.2s;
	white-space: nowrap;
}

.btn-delete:hover {
	background-color: #c73444;
}

.badge {
	display: inline-block;
	padding: 4px 12px;
	border-radius: 12px;
	font-size: 0.78rem;
	font-weight: 700;
}

.badge-active {
	background: #d1fae5;
	color: #065f46;
}

.badge-inactive {
	background: #fee2e2;
	color: #991b1b;
}

.empty-state {
	text-align: center;
	padding: 40px 20px;
	color: #94a3b8;
}

.empty-state p {
	font-size: 1rem;
	margin-bottom: 14px;
}
</style>
</head>
<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<p th:if="${msg}" id="msgBox"
		th:style="'background:' + ${bgColor} + '; color:' + ${textColor} + ';'">
		<span th:text="${msg}"></span> <span
			onclick="this.parentElement.style.display='none'"
			style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; font-weight: bold;">✕</span>
	</p>

	<div class="page-content">

		<div class="top-bar">
			<h2>🏭 Warehouses</h2>
			<a href="/warehouses/createWarehousePage" class="btn-add">＋
				Create New Warehouse</a>
		</div>

		<div class="table-wrapper" th:if="${not #lists.isEmpty(warehouses)}">
			<table id="warehousesTable">
				<thead>
					<tr>
						<th class="sortable" data-col="0">ID<span class="sort-arrow">⇅</span></th>
						<th class="sortable" data-col="1">Name<span
							class="sort-arrow">⇅</span></th>
						<th class="sortable" data-col="2">Address<span
							class="sort-arrow">⇅</span></th>
						<th class="sortable" data-col="3">Status<span
							class="sort-arrow">⇅</span></th>
						<th class="sortable" data-col="4">Created At<span
							class="sort-arrow">⇅</span></th>
						<th class="sortable" data-col="5">Modified At<span
							class="sort-arrow">⇅</span></th>
						<th>Details</th>
						<th>Delete</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="w : ${warehouses}"
						th:data-href="@{'/warehouses/viewOrEditWarehouse/' + ${w.warehouseId}}"
						onclick="rowClick(event, this)">


						<td><span class="cell-link"> <a
								th:href="@{'/warehouses/viewOrEditWarehouse/' + ${w.warehouseId}}"
								th:text="${w.warehouseId}" onclick="event.stopPropagation()"></a>
								<span class="cell-tip">View or edit warehouse</span>
						</span></td>

						<td th:text="${w.warehouseName}"></td>
						<td th:text="${w.warehouseAddress}"></td>

						<td><span class="badge"
							th:classappend="${w.warehouseStatus == 'Active'} ? 'badge-active' : 'badge-inactive'"
							th:text="${w.warehouseStatus}"></span></td>

						<td
							th:text="${formattedCreatedAt != null} ? ${formattedCreatedAt} : ${w.createdAt}"></td>
						<td
							th:text="${formattedModifiedAt != null} ? ${formattedModifiedAt} : ${w.modifiedAt}"></td>

						<td><a
							th:href="@{'/warehouses/viewOrEditWarehouse/' + ${w.warehouseId}}"
							class="btn-view" onclick="event.stopPropagation()"> ✏️ View /
								Edit <span class="cell-tip">View or edit warehouse</span>
						</a></td>

						<td>
							<form
								th:action="@{'/warehouses/deleteWarehouse/' + ${w.warehouseId}}"
								method="post" onclick="event.stopPropagation()">
								<button type="submit" class="btn-delete"
									onclick="return confirm('Are you sure you want to delete this warehouse?')">
									🗑 Delete</button>
							</form>
						</td>

					</tr>
				</tbody>
			</table>
		</div>

		<div th:if="${#lists.isEmpty(warehouses)}" class="empty-state">
			<p>No warehouse records to display.</p>
			<a href="/warehouses/createWarehousePage"
				style="background: #4CAF50; color: white; padding: 9px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">
				＋ Create New Warehouse </a>
		</div>

	</div>

	<script>
    function rowClick(event, row) { window.location.href = row.getAttribute('data-href'); }
    window.addEventListener("load", function () {
      var msg = document.getElementById("msgBox");
      if (msg) setTimeout(() => msg.style.display = "none", 10000);
    });
    
    
    /* ══ TABLE SORT ══ */
	
	function rowClick(event, row) { window.location.href = row.getAttribute('data-href'); }
	
    (function () {
      let sortState = { col: -1, asc: true };

      document.querySelectorAll('thead th.sortable').forEach(th => {
        th.addEventListener('click', function () {
          const col = parseInt(this.dataset.col, 10);
          sortState.col === col ? (sortState.asc = !sortState.asc) : (sortState.col = col, sortState.asc = true);

          document.querySelectorAll('thead th.sortable').forEach(h => {
            h.classList.remove('sort-asc', 'sort-desc');
            h.querySelector('.sort-arrow').textContent = '⇅';
          });
          this.classList.add(sortState.asc ? 'sort-asc' : 'sort-desc');
          this.querySelector('.sort-arrow').textContent = sortState.asc ? '↑' : '↓';

          const tbody = document.querySelector('#warehousesTable tbody');
          const rows  = Array.from(tbody.querySelectorAll('tr'));

          rows.sort((a, b) => {
            const cellA = getCellText(a, col);
            const cellB = getCellText(b, col);
            let cmp;

         if (col === 4 || col === 5) {
              // replace space with T for cross-browser ISO parsing
              const dA = new Date(cellA.trim().replace(' ', 'T'));
              const dB = new Date(cellB.trim().replace(' ', 'T'));
              cmp = (isNaN(dA) || isNaN(dB)) ? cellA.localeCompare(cellB) : dA - dB;
            } else {
              cmp = cellA.localeCompare(cellB, undefined, { numeric: true, sensitivity: 'base' });
            }
            return sortState.asc ? cmp : -cmp;
          });

          rows.forEach(r => tbody.appendChild(r)); 
        });
      });

      function getCellText(row, col) {
        const cell = row.querySelectorAll('td')[col];
        if (!cell) return '';
        if ((col === 4 || col === 5) && cell.dataset.sort) return cell.dataset.sort;
        const link = cell.querySelector('a');
        return (link ? link.textContent : cell.textContent).trim();
      }
    })();
    
    
  </script>
</body>
</html>
