<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<link rel="stylesheet" th:href="@{/css/navbar.css}" />
<style>
table {
	width: 90%;
	border-collapse: separate;
	border-spacing: 0 6px;
	font-family: Arial, sans-serif;
	border: none;
	box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
}

thead th {
	text-align: center;
	padding: 6px;
	color: #374151;
	background: #ededb9;
	border: 1px #e6e65c;
}

tbody tr {
	box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
	margin: auto auto;
}

td {
	padding: 8px;
	margin: auto auto;
	text-align: center;
}

/* tbody tr td:first-child {
	border-top-left-radius: 8px;
	border-bottom-left-radius: 8px;
}

tbody tr td:last-child {
	border-top-right-radius: 8px;
	border-bottom-right-radius: 8px;
} */
tbody tr:hover {
	transform: scale(1.01);
	transition: 0.2s;
	background: #efefef;
}

button {
	margin: 3px 3px;
	padding: 10px 10px;
	cursor: pointer;
}

button:hover {
	transform: scale(1.01);
	transition: 0.2s;
}

#viewShipmentDetails {
	background-color: #b4dcef;
	color: #5015b9;
	font-weight: bold;
	text-decoration: none;
	margin: 3px 3px;
	padding: 10px 10px;
	cursor: pointer;
}

.href-styling {
	display: inline-block;
	font-weight: bold;
	padding: 10px 20px;
	text-decoration: none;
	border-radius: 6px;
}

.active-a-tag {
	background-color: #4CAF50;
	color: white;
	pointer-events: none;
	border: 2px solid green;
}
</style>

</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<!-- 	<h2>All Customers</h2> -->

	<p th:if="${msg}" id="msgBox"
		th:style="'background:' + ${bgColor} + '; color:' + ${textColor} + '; padding:10px; border-radius:6px; position:relative; font-weight:bold;'">
		<span th:text="${msg}"></span>&nbsp;&nbsp;&nbsp;&nbsp;
		<!-- ❌ Close button -->
		<span onclick="this.parentElement.style.display='none'"
			style="position: absolute; margin: auto; right: 14px; cursor: pointer; font-weight: bold;">
			X </span>

	</p>
	<br />
	<a href="/customers/goToCreateCustomerPage"
		style="display: inline-block; background-color: #4CAF50; color: #fcfaf5; font-weight: bold; padding: 10px 20px; text-decoration: none; border-radius: 6px;">Create
		New Customer</a>
	<br />
	<table border="1">
		<thead>
			<tr>
				<th>ID</th>
				<th>Name</th>
				<th>Valid Up to</th>
				<th>Status</th>
				<th>Created At</th>
				<th>Modified At</th>
				<th colspan="2">Actions</th>
			</tr>
		</thead>
		<tr th:each="c : ${customers}">
			<td><a th:href="@{'/customers/editCustomer/' + ${c.customerId}}"
				style="color: blue; font-weight: bold; ">
					<span th:text="${c.customerId}"></span>
			</a></td>
 			<td th:text="${c.customerName}"></td>
			<td th:text="${c.validUpto}"></td>
			<!-- <td th:text="${c.customerStatus}"></td> -->
			<td><span th:text="${c.customerStatus}"
				th:style="${c.customerStatus == 'Active'} ? 
                    'background:#d4edda; color:#155724; padding:3px 10px; border-radius:12px; font-weight:bold;' : 
                    'background:#f8d7da; color:#721c24; padding:3px 10px; border-radius:12px; font-weight:bold;'">
			</span></td>
			<td th:text="${c.createdAt}"></td>
			<td th:text="${c.modifiedAt}"></td>
			<td><a th:href="@{'/customers/editCustomer/' + ${c.customerId}}"
				style="display: inline-block; background-color: #6a73b2; color: #fcfaf5; font-weight: bold; padding: 10px 20px; font-size: 13px; text-decoration: none; border-radius: 6px; border-color: white; cursor: pointer;">View
					/ Edit Customer</a></td>
			<td>
				<form th:action="@{'/customers/deleteCustomer/' + ${c.customerId}}"
					method="post">
					<button type="submit"
						onclick="return confirm('Are you sure you want to delete this customer?')"
						style="display: inline-block; background-color: #ed4758; color: #ffffff; font-weight: bold; padding: 10px 20px; font-size: 13px; text-decoration: none; border-radius: 6px; border-color: white; cursor: pointer;">Delete
						Customer</button>
				</form>
			</td>
		</tr>
	</table>

	<!-- Show this if customers list is EMPTY -->
	<div th:if="${#lists.isEmpty(customers)}"
		style="text-align: center; color: #888;">
		<p style="font-size: 1.1rem; margin-bottom: 10px;">No Customers
			records to display.</p>
		<br /> <a href="/customers/goToCreateCustomerPage"
			style="background: #4CAF50; color: white; padding: 8px 18px; border-radius: 6px; text-decoration: none; font-weight: bold;">
			Create New Customer </a>
	</div>

	<script>
		window.addEventListener("load", function () {
			var msg = document.getElementById("msgBox");
			if (msg) {
				setTimeout(function () {
					msg.style.display = "none";
				}, 10000);
			}
		});
	</script>

</body>

</html>
