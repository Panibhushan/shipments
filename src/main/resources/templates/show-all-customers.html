<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" th:href="@{/css/navbar.css}" />
<style>
*, *::before, *::after {
	box-sizing: border-box;
}

body {
	font-family: Arial, sans-serif;
	background: #f4f6f9;
	margin: 0;
	min-height: 100vh;
}

#msgBox {
	margin: 8px 24px 0;
	padding: 8px 40px 8px 14px;
	border-radius: 8px;
	font-weight: bold;
	position: relative;
}

.page-content {
	padding: 14px 24px;
}

.top-bar {
	display: flex;
	align-items: center;
	justify-content: space-between;
	margin-bottom: 12px;
}

.top-bar h2 {
	margin: 0;
	font-size: 1rem;
	font-weight: 700;
	color: #1e293b;
}

.btn-add {
	display: inline-block;
	background-color: #4CAF50;
	color: #fff;
	font-weight: 700;
	font-size: 0.88rem;
	padding: 9px 20px;
	text-decoration: none;
	border-radius: 8px;
	transition: background-color 0.2s, transform 0.15s;
}

.btn-add:hover {
	background-color: #3d9140;
	transform: translateY(-1px);
}

.table-wrapper {
	background: #fff;
	border-radius: 12px;
	box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
	overflow: hidden;
}

table {
	width: 100%;
	border-collapse: collapse;
	font-family: Arial, sans-serif;
	font-size: 0.88rem;
}

thead th {
	text-align: center;
	padding: 11px 14px;
	color: #374151;
	background: #f1f5f9;
	font-size: 0.72rem;
	font-weight: 700;
	text-transform: uppercase;
	letter-spacing: 0.07em;
	border-bottom: 2px solid #e2e8f0;
}

tbody tr {
	border-bottom: 1px solid #f1f5f9;
	cursor: pointer;
	transition: background 0.15s, transform 0.15s;
}

tbody tr:last-child {
	border-bottom: none;
}

tbody tr:hover {
	background: #eef2ff;
	transform: scale(1.005);
}

td {
	padding: 10px 14px;
	text-align: center;
	color: #374151;
}

.cell-link {
	position: relative;
	display: inline-block;
}

.cell-link a {
	color: #4a6fa5;
	font-weight: 700;
	text-decoration: none;
	border-bottom: 1px dashed #4a6fa5;
}

.cell-link a:hover {
	color: #2c4a7c;
}

.cell-link .cell-tip {
	visibility: hidden;
	opacity: 0;
	background: #1e293b;
	color: #fff;
	font-size: 0.72rem;
	padding: 5px 10px;
	border-radius: 5px;
	white-space: nowrap;
	position: absolute;
	bottom: 130%;
	left: 50%;
	transform: translateX(-50%);
	transition: opacity 0.18s;
	pointer-events: none;
	z-index: 10;
}

.cell-link .cell-tip::after {
	content: '';
	position: absolute;
	top: 100%;
	left: 50%;
	transform: translateX(-50%);
	border-width: 4px;
	border-style: solid;
	border-color: #1e293b transparent transparent transparent;
}

.cell-link:hover .cell-tip {
	visibility: visible;
	opacity: 1;
}

.btn-view {
	display: inline-block;
	background-color: #6a73b2;
	color: #fff;
	font-weight: 700;
	font-size: 0.78rem;
	padding: 7px 14px;
	text-decoration: none;
	border-radius: 6px;
	white-space: nowrap;
	transition: background-color 0.2s;
	position: relative;
}

.btn-view:hover {
	background-color: #555fa0;
}

.btn-view .cell-tip {
	visibility: hidden;
	opacity: 0;
	background: #1e293b;
	color: #fff;
	font-size: 0.72rem;
	padding: 5px 10px;
	border-radius: 5px;
	white-space: nowrap;
	position: absolute;
	bottom: 130%;
	left: 50%;
	transform: translateX(-50%);
	transition: opacity 0.18s;
	pointer-events: none;
	z-index: 10;
}

.btn-view .cell-tip::after {
	content: '';
	position: absolute;
	top: 100%;
	left: 50%;
	transform: translateX(-50%);
	border-width: 4px;
	border-style: solid;
	border-color: #1e293b transparent transparent transparent;
}

.btn-view:hover .cell-tip {
	visibility: visible;
	opacity: 1;
}

.btn-delete {
	background-color: #ed4758;
	color: #fff;
	font-weight: 700;
	font-size: 0.78rem;
	padding: 7px 14px;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	transition: background-color 0.2s;
	white-space: nowrap;
}

.btn-delete:hover {
	background-color: #c73444;
}

.badge {
	display: inline-block;
	padding: 4px 12px;
	border-radius: 12px;
	font-size: 0.78rem;
	font-weight: 700;
}

.badge-active {
	background: #d1fae5;
	color: #065f46;
}

.badge-inactive {
	background: #fee2e2;
	color: #991b1b;
}

.empty-state {
	text-align: center;
	padding: 40px 20px;
	color: #94a3b8;
}

.empty-state p {
	font-size: 1rem;
	margin-bottom: 14px;
}
</style>
</head>
<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<p th:if="${msg}" id="msgBox"
		th:style="'background:' + ${bgColor} + '; color:' + ${textColor} + ';'">
		<span th:text="${msg}"></span> <span
			onclick="this.parentElement.style.display='none'"
			style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; font-weight: bold;">✕</span>
	</p>
	<div class="page-content">
		<div class="top-bar">
			<h2>🧑‍💼 Customers</h2>
			<a href="/customers/goToCreateCustomerPage" class="btn-add">＋
				Create New Customer</a>
		</div>
		<div class="table-wrapper" th:if="${not #lists.isEmpty(customers)}">
			<table id="customersTable">
				<thead>
					<tr>
						<th class="sortable" data-col="0">ID<span class="sort-arrow">⇅</span></th>
						<th class="sortable" data-col="1">Name<span
							class="sort-arrow">⇅</span></th>
						<th class="sortable" data-col="2">Valid Up To<span
							class="sort-arrow">⇅</span></th>
						<th class="sortable" data-col="3">Status<span
							class="sort-arrow">⇅</span></th>
						<th class="sortable" data-col="4">Email<span
							class="sort-arrow">⇅</span></th>
						<th class="sortable" data-col="5">Created At<span
							class="sort-arrow">⇅</span></th>
						<th class="sortable" data-col="6">Modified At<span
							class="sort-arrow">⇅</span></th>
						<th>Details</th>
						<th>Delete</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="c : ${customers}"
						th:data-href="@{'/customers/editCustomer/' + ${c.customerId}}"
						onclick="rowClick(event, this)">
						<td><span class="cell-link"><a
								th:href="@{'/customers/editCustomer/' + ${c.customerId}}"
								th:text="${c.customerId}" onclick="event.stopPropagation()"></a><span
								class="cell-tip">View or edit customer</span></span></td>
						<td th:text="${c.customerName}"></td>
						<!-- 						<td th:text="${c.validUpto}"></td>
 -->
						<td th:attr="data-sort=${c.validUpto}"><span
							th:text="${c.validUpto != null ? #strings.toUpperCase(c.validUpto) + ' PM IST' : ''}">
						</span> <span
							th:if="${c.validUpto != null and 
        T(java.time.LocalDateTime)
        .parse(
            c.validUpto.toString(),
            T(java.time.format.DateTimeFormatter)
            .ofPattern('dd-MMM-yyyy HH:mm:ss')
        )
        .toLocalDate()
        .isBefore(T(java.time.LocalDate).now())}"
							style="color: red; font-weight: bold; margin-left: 6px;"
							class="badge badge-inactive"> Expired </span></td>
						<td><span class="badge"
							th:classappend="${c.customerStatus == 'Active'} ? 'badge-active' : 'badge-inactive'"
							th:text="${c.customerStatus}"></span></td>
						<td th:text="${c.customerEmail}"></td>
						<td th:text="${c.createdAt}"></td>
						<td th:text="${c.modifiedAt}"></td>
						<td><a
							th:href="@{'/customers/editCustomer/' + ${c.customerId}}"
							class="btn-view" onclick="event.stopPropagation()">✏️ View /
								Edit<span class="cell-tip">View or edit customer</span>
						</a></td>
						<td><form
								th:action="@{'/customers/deleteCustomer/' + ${c.customerId}}"
								method="post" onclick="event.stopPropagation()">
								<button type="submit" class="btn-delete"
									onclick="return confirm('Are you sure you want to delete this customer?')">🗑
									Delete</button>
							</form></td>
					</tr>
				</tbody>
			</table>
		</div>
		<div th:if="${#lists.isEmpty(customers)}" class="empty-state">
			<p>No customer records to display.</p>
			<a href="/customers/goToCreateCustomerPage"
				style="background: #4CAF50; color: white; padding: 9px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">＋
				Create New Customer</a>
		</div>
	</div>
	<script>
    function rowClick(event, row) { window.location.href = row.getAttribute('data-href'); }
    window.addEventListener("load", function () { var msg = document.getElementById("msgBox"); if (msg) setTimeout(() => msg.style.display = "none", 10000); });
  
    /* ══ TABLE SORT ══ */
	
	function rowClick(event, row) { window.location.href = row.getAttribute('data-href'); }
	
    (function () {
      let sortState = { col: -1, asc: true };

      document.querySelectorAll('thead th.sortable').forEach(th => {
        th.addEventListener('click', function () {
          const col = parseInt(this.dataset.col, 10);
          sortState.col === col ? (sortState.asc = !sortState.asc) : (sortState.col = col, sortState.asc = true);

          document.querySelectorAll('thead th.sortable').forEach(h => {
            h.classList.remove('sort-asc', 'sort-desc');
            h.querySelector('.sort-arrow').textContent = '⇅';
          });
          this.classList.add(sortState.asc ? 'sort-asc' : 'sort-desc');
          this.querySelector('.sort-arrow').textContent = sortState.asc ? '↑' : '↓';

          const tbody = document.querySelector('#customersTable tbody');
          const rows  = Array.from(tbody.querySelectorAll('tr'));

          rows.sort((a, b) => {
            const cellA = getCellText(a, col);
            const cellB = getCellText(b, col);
            let cmp;

         if ( col === 5 || col === 6) {
              // replace space with T for cross-browser ISO parsing
              const dA = new Date(cellA.trim().replace(' ', 'T'));
              const dB = new Date(cellB.trim().replace(' ', 'T'));
              cmp = (isNaN(dA) || isNaN(dB)) ? cellA.localeCompare(cellB) : dA - dB;
            }else if (col === 2){
            	const dA = parseCustomDate(cellA);
            	const dB = parseCustomDate(cellB);
            	cmp = (!dA || !dB)  ? cellA.localeCompare(cellB) : dA - dB;
            }else {
              cmp = cellA.localeCompare(cellB, undefined, { numeric: true, sensitivity: 'base' });
            }
            return sortState.asc ? cmp : -cmp;
          });

          rows.forEach(r => tbody.appendChild(r)); 
        });
      });

      function getCellText(row, col) {
        const cell = row.querySelectorAll('td')[col];
        if (!cell) return '';
        if ((col === 2 || col === 5 || col === 6) && cell.dataset.sort) return cell.dataset.sort;
        const link = cell.querySelector('a');
        return (link ? link.textContent : cell.textContent).trim();
      }
    })();
    
    //parsing for validUpto
    function parseCustomDate(str) {

        if (!str) return null;

        // Example:
        // 29-May-2026 23:59:59

        const parts = str.match(
            /^(\d{2})-([A-Za-z]{3})-(\d{4}) (\d{2}):(\d{2}):(\d{2})$/
        );

        if (!parts) return null;

        const months = {
            Jan: 0, Feb: 1, Mar: 2, Apr: 3,
            May: 4, Jun: 5, Jul: 6, Aug: 7,
            Sep: 8, Oct: 9, Nov: 10, Dec: 11
        };

        return new Date(
            parseInt(parts[3]),             // year
            months[parts[2]],              // month
            parseInt(parts[1]),            // day
            parseInt(parts[4]),            // hour
            parseInt(parts[5]),            // minute
            parseInt(parts[6])             // second
        );
    }
    
    </script>
</body>
</html>
