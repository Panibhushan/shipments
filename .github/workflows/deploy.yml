name: Build & Deploy to EC2 (Amazon Linux + Java 21)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"

      # 3. Cache Maven dependencies
      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Build JAR
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 5. Setup SSH Key
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH setup done"

      # 6. Create App Directory on EC2   ← NEW STEP ADDED
      - name: Create App Directory on EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo mkdir -p /opt/myapp && sudo chown ec2-user:ec2-user /opt/myapp"

      # 7. Copy JAR to EC2
      - name: Copy JAR to EC2
        run: |
          scp -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            target/*.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/myapp/app.jar

      # 8. Restart App on EC2
      - name: Restart Application
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

              echo ">>> Creating systemd service..."
              sudo tee /etc/systemd/system/myapp.service > /dev/null << 'SERVICE'
              [Unit]
              Description=My Java Application
              After=syslog.target network.target

              [Service]
              User=ec2-user
              WorkingDirectory=/opt/myapp
              ExecStart=/usr/bin/java -jar /opt/myapp/app.jar
              SuccessExitStatus=143
              Restart=on-failure
              RestartSec=10
              StandardOutput=journal
              StandardError=journal

              [Install]
              WantedBy=multi-user.target
              SERVICE

              echo ">>> Reloading systemd..."
              sudo systemctl daemon-reload

              echo ">>> Enabling service..."
              sudo systemctl enable myapp

              echo ">>> Stopping existing app..."
              sudo systemctl stop myapp || true
              sleep 3

              echo ">>> Starting new version..."
              sudo systemctl start myapp
              sleep 5

              echo ">>> Checking status..."
              sudo systemctl status myapp --no-pager

              echo ">>> Recent logs..."
              sudo journalctl -u myapp -n 20 --no-pager
          EOF

      # 9. Cleanup SSH key
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key.pem
