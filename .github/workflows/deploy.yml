name: Build & Deploy to EC2 (Amazon Linux + Java 21)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # STEP 1: Checkout the latest code from GitHub
      # ─────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # STEP 2: Set up Java 21 (Amazon Corretto)
      # Must match the Java version used on EC2
      # ─────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"

      # ─────────────────────────────────────────
      # STEP 3: Cache Maven dependencies
      # Speeds up builds by reusing downloaded JARs
      # Cache key changes only when pom.xml changes
      # ─────────────────────────────────────────
      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ─────────────────────────────────────────
      # STEP 4: Build the Spring Boot JAR
      # -DskipTests → skips unit tests during build
      # Output: target/*.jar
      # ─────────────────────────────────────────
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # ─────────────────────────────────────────
      # STEP 5: Setup SSH key for EC2 access
      # EC2_SSH_KEY → private key stored in GitHub Secrets
      # EC2_HOST    → EC2 public IP stored in GitHub Secrets
      # ─────────────────────────────────────────
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH setup done"

      # ─────────────────────────────────────────
      # STEP 6: Create the app directory on EC2
      # /opt/myapp → where the JAR and .env live
      # chown ensures ec2-user has write access
      # ─────────────────────────────────────────
      - name: Create App Directory on EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo mkdir -p /opt/myapp && sudo chown ec2-user:ec2-user /opt/myapp"

      # ─────────────────────────────────────────
      # STEP 7: Copy the built JAR to EC2
      # Copies from GitHub Actions runner → EC2
      # Renamed to app.jar for consistency
      # ─────────────────────────────────────────
      - name: Copy JAR to EC2
        run: |
          scp -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            target/*.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/myapp/app.jar

      # ─────────────────────────────────────────
      # STEP 8: Create .env file on EC2
      # Injects secrets from GitHub → /opt/myapp/.env
      # These are read by dotenv at app startup
      #
      # Why printf instead of echo/heredoc?
      # → Passwords with special chars like $ are
      #   safely handled without shell expansion
      #
      # GitHub Secrets needed:
      #   DB_URL_CLOUD      → RDS JDBC connection URL
      #   DB_USERNAME_CLOUD → RDS master username
      #   DB_PASSWORD_CLOUD → RDS master password
      # ─────────────────────────────────────────
      - name: Create .env file on EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "printf '%s\n' \
              'DB_URL_CLOUD=${{ secrets.DB_URL_CLOUD }}' \
              'DB_USERNAME_CLOUD=${{ secrets.DB_USERNAME_CLOUD }}' \
              'DB_PASSWORD_CLOUD=${{ secrets.DB_PASSWORD_CLOUD }}' \
              > /opt/myapp/.env"

      # ─────────────────────────────────────────
      # STEP 9: Deploy and restart app on EC2
      #
      # Creates a systemd service file for the app
      # Key setting: -Ddotenv.directory=/opt/myapp
      #   → Tells the app to load .env from /opt/myapp
      #   → Without this, dotenv defaults to "./" which
      #     doesn't resolve correctly under systemd
      #   → Locally, this JVM arg is NOT set, so dotenv
      #     defaults to "./" (project root) where local
      #     .env file exists — works for both environments
      # ─────────────────────────────────────────
      - name: Restart Application
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            -T \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo tee /etc/systemd/system/myapp.service > /dev/null << 'EOF'
          [Unit]
          Description=My Java Application
          After=syslog.target network.target

          [Service]
          User=ec2-user
          WorkingDirectory=/opt/myapp

          # -Ddotenv.directory=/opt/myapp tells ShipmentsApplication.java
          # to load the .env file from /opt/myapp instead of "./"
          # This is the key fix for EC2 vs local environment difference
          ExecStart=/usr/bin/java -Ddotenv.directory=/opt/myapp -jar /opt/myapp/app.jar

          SuccessExitStatus=143
          Restart=on-failure
          RestartSec=10
          StandardOutput=append:/opt/myapp/app.log
          StandardError=append:/opt/myapp/app.log

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload && \
          sudo systemctl enable myapp && \
          sudo systemctl stop myapp || true && \
          sleep 3 && \
          sudo systemctl start myapp && \
          sleep 5 && \
          sudo systemctl status myapp --no-pager && \
          sudo journalctl -u myapp -n 20 --no-pager"

      # ─────────────────────────────────────────
      # STEP 10: Configure Nginx as Reverse Proxy
      #
      # Installs Nginx (if not already installed) and
      # sets up a reverse proxy so that HTTP traffic
      # arriving at panivsprojects.dnsps.org on port 80
      # is forwarded to the Spring Boot app on port 8888.
      #
      # Prerequisites (one-time manual setup on EC2):
      #   1. Your domain's A record must point to EC2's
      #      public IP in your DNS provider (dnsps.org)
      #   2. Port 80 (and optionally 443) must be open
      #      in the EC2 Security Group inbound rules
      #
      # What this step does on every deploy:
      #   - Installs nginx if missing
      #   - Writes /etc/nginx/conf.d/myapp.conf
      #   - Tests the config, then reloads Nginx
      #     (reload = zero-downtime config refresh)
      # ─────────────────────────────────────────
      - name: Configure Nginx Reverse Proxy
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            -T \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo yum install -y nginx > /dev/null 2>&1 && \
          sudo tee /etc/nginx/conf.d/myapp.conf > /dev/null << 'EOF'
          server {
              listen 80;
              server_name panivsprojects.dnsps.org;
          
              location / {
                  proxy_pass         http://localhost:8888;
                  proxy_http_version 1.1;
          
                  proxy_set_header   Host              \$host;
                  proxy_set_header   X-Real-IP         \$remote_addr;
                  proxy_set_header   X-Forwarded-For   \$proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto \$scheme;
          
                  proxy_connect_timeout 60s;
                  proxy_send_timeout    60s;
                  proxy_read_timeout    60s;
              }
          }
          EOF
          sudo nginx -t && \
          sudo systemctl enable nginx && \
          sudo systemctl reload nginx || sudo systemctl start nginx && \
          echo 'Nginx configured and running'"

      # ─────────────────────────────────────────
      # STEP 11: Cleanup SSH key from runner
      # Always runs even if previous steps fail
      # Prevents key from being left on the runner
      # ─────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key.pem
