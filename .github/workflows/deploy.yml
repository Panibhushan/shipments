name: Build & Deploy to EC2 (Amazon Linux + Java 21)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'   # Amazon Corretto — matches EC2 runtime

      # 3. Cache Maven dependencies
      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Build JAR
      - name: Build with Maven
        run: mvn clean package -DskipTests
        # For Gradle: ./gradlew clean build -x test

      # 5. Setup SSH Key
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 6. Copy JAR to EC2
      - name: Copy JAR to EC2
        run: |
          scp -i ~/.ssh/deploy_key.pem \
            target/*.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/myapp/app.jar

      # 7. Restart App on EC2
      - name: Restart Application
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
              echo ">>> Stopping existing app..."
              sudo systemctl stop myapp || true
              sleep 3

              echo ">>> Starting new version..."
              sudo systemctl start myapp
              sleep 5

              echo ">>> Checking status..."
              sudo systemctl status myapp --no-pager

              echo ">>> Recent logs..."
              sudo journalctl -u myapp -n 20 --no-pager
          EOF

      # 8. Cleanup SSH key
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key.pem